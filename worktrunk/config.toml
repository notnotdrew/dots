# User Configuration
# Applies to every repository.

[aliases]
# Remove worktrees already integrated into the default branch.
#   wt clean           — prune
#   wt clean dry       — preview (--dry-run)
#   wt clean --min-age=2d — forward other prune flags
clean = '''
args={{ args }}
if [ "$args" = "dry" ]; then
  wt step prune --dry-run
else
  wt step prune {{ args }}
fi
'''
