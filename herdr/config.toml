onboarding = false

# Herdr has no navigate-mode surface for the Agent panel, so step through it
# with direct chords instead. iTerm sends Option as a composed character
# ("Option Key Sends" = Normal), so alt chords never arrive; modified arrows
# use standard CSI encoding and do.
[keys]
previous_agent = "ctrl+shift+up"
next_agent = "ctrl+shift+down"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "vv.golden-ratio.apply"
description = "golden ratio"

# herdr-annotate — copy-context is prefix+shift+c.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

# prefix+o is herdr's builtin open_notification_target; annotate.open lives on
# prefix+d so both stay reachable.
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

# worktrunk — prefix+shift+g replaces herdr's builtin "new worktree".
# Do not bind worktrunk.open-current to prefix+shift+c (annotate.copy-context).
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "worktree: switch / create from default branch"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "worktree: remove"

[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "worktrunk.open-with-remotes"
description = "worktree: switch / create including remotes"

# These four run as type = "pane", not type = "popup". A popup is
# session-modal: while it is up, prefix chords and workspace switching are
# swallowed, so a minute-long herdr-start-work traps the whole session. A pane
# is a real pane in the current tab that closes when the command exits, so the
# flow can be left running while you work elsewhere.
# Panes take no width/height; herdr warns and ignores them.
#
# A pane is not ephemeral, though: it holds a split in whichever workspace was
# focused, and nothing in Herdr lists plain panes across workspaces. Each of
# these scripts sources bin/lib/herdr-pane-agent.bash to claim a row in the
# Agents panel while it runs, so a split left waiting for a keypress can be
# found from anywhere with ctrl+shift+up / ctrl+shift+down.

# Curated shortlist of keys worth using, kept in herdr/keybindings.md.
# prefix+? still shows the full live keymap.
[[keys.command]]
key = "prefix+u"
type = "pane"
command = "herdr-help"
description = "keys worth using"

# Sets the $note token on the branch-row sidebar layout.
[[keys.command]]
key = "prefix+shift+m"
type = "pane"
command = "herdr-note"
description = "workspace: set note"

# Asks what to work on, then creates and staffs a child worktree workspace.
[[keys.command]]
key = "prefix+shift+s"
type = "pane"
command = "herdr-start-work"
description = "workspace: start work on a task"

# Same flow, hardcoded to "tidy herdr" on a dots worktree.
[[keys.command]]
key = "prefix+shift+y"
type = "pane"
command = "herdr-tidy"
description = "workspace: tidy herdr"

[ui]
# Prompt for a name when creating a workspace instead of generating one.
prompt_new_workspace_name = true

# Herdr suppresses the built-in branch and git_status tokens on indented
# worktree children, so the drew.branch-token plugin reports $branch for those.
# The two never appear together: whichever applies fills the branch row.
# Row 2 holds the $note token, set by herdr-note.
# Unreported tokens drop their row, so plain workspaces stay uncluttered.
[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", bold = true }],
  [{ token = "$note", dim = true }],
  ["git_status", { token = "branch", dim = true }, { token = "$branch", dim = true }],
]

[ui.toast]
delivery = "system"

[theme]
name = "terminal"
auto_switch = false

# The "terminal" theme maps UI surfaces onto static ANSI slots, so the sidebar's
# highlight rows can land on a color with almost no contrast against the host
# background (herdr issues #1023, #1307, #1731). Pin them to gruvbox tones that
# read against this profile's #32302f background.
# selection_bg = Navigate-mode cursor row; active_row_bg = active space/agent row.
[theme.custom]
active_row_bg = "#3c3836"
selection_bg = "#665c54"
